name: Semgrep

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '20 17 * * 1'   # weekly full-repository scan
  workflow_dispatch: {}

permissions: {}

jobs:
  semgrep:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the whole repository
        run: >
          semgrep scan --metrics=off
          --config p/python --config p/secrets --config .semgrep/
          --exclude tests --exclude .semgrep
          --sarif-output=semgrep.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
